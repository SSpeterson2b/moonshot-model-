<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonshot AI – Daily HR Picks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo">
        <span class="ball">⚾</span>
        <h1>Moonshot AI</h1>
      </div>
      <p class="subtitle">S.P.A.R.K Model • Daily MLB Home Run Picks</p>
      <p class="date" id="todayDate"></p>
    </header>

    <!-- Top Picks -->
    <section>
      <h2><span class="icon">🔥</span> Top HR Picks</h2>
      <div class="picks-grid" id="picksContainer"></div>
    </section>

    <!-- Best 2-Leg Parlay -->
    <section class="parlay-section">
      <h2><span class="icon">💎</span> Best 2-Leg Parlay</h2>
      <div class="parlay-card" id="parlayContainer"></div>
    </section>

    <footer>
      <p>Model updated daily • For educational & entertainment purposes</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
